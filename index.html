<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博云 - 私有云 AI 助理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
            color: #111;
        }

        .container {
            max-width: 320px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 18px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .app-name {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .slogan {
            font-size: 14px;
            color: #666;
            margin-bottom: 48px;
        }

        .download-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
            background: #fff;
            color: #111;
            border: 1px solid #ddd;
        }

        .download-btn:hover {
            border-color: #999;
            background: #fafafa;
        }

        .btn-icon {
            width: 22px;
            height: 22px;
            opacity: 0.8;
        }

        .btn-text {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-arrow {
            opacity: 0.6;
        }

        .footer-hint {
            margin-top: 48px;
            font-size: 11px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="logo.png" alt="赛博云 Logo">
        </div>

        <h1 class="app-name">Cyberwing</h1>
        <p class="app-subtitle">赛博云</p>
        <p class="tagline">Personal Cloud Assistant</p>
        <p class="slogan">你的私有云AI助理</p>

        <div class="download-section">
            <a href="https://testflight.apple.com/join/VhjdMu3w" class="download-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                <div class="btn-text">
                    <span>iOS</span>
                    <span class="btn-arrow">→</span>
                </div>
            </a>

            <a href="http://download.getaiti.com/androidapp" class="download-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.463 11.463 0 0 0-8.94 0L5.65 5.67c-.19-.29-.58-.38-.87-.2-.28.18-.37.54-.22.83L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.78 10.78 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/>
                </svg>
                <div class="btn-text">
                    <span>Android</span>
                    <span class="btn-arrow">→</span>
                </div>
            </a>

            <a href="http://download.getaiti.com/winclient" class="download-btn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 18c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
                </svg>
                <div class="btn-text">
                    <span>Windows</span>
                    <span class="btn-arrow">→</span>
                </div>
            </a>

            <a href="#" class="download-btn" style="opacity: 0.5; cursor: not-allowed;">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
                    <circle cx="12" cy="12" r="5"/>
                </svg>
                <div class="btn-text">
                    <span>鸿蒙</span>
                    <span style="font-size: 12px; color: #999;">敬请期待</span>
                </div>
            </a>
        </div>

        <p class="footer-hint">扫码下载，开启智能私有云</p>
        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 12px; align-items: center;">
            <a href="howto.html" style="font-size: 14px; color: #111; text-decoration: none; padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: #fff;">📖 使用说明</a>
            <a href="https://beian.miit.gov.cn/" target="_blank" style="font-size: 12px; color: #999; text-decoration: none;">皖ICP备18006700号-2</a>
        </div>
    </div>
</body>
</html>
